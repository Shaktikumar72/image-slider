<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Image Gallery</h1>
        <div class="images">
            <img src="https://picsum.photos/id/236/200/300" alt="" class="slide">
            <img src="https://picsum.photos/id/237/200/300" alt="" class="slide">
            <img src="https://picsum.photos/id/238/200/300" alt="" class="slide">
            <img src="https://picsum.photos/id/239/200/300" alt="" class="slide">
            <img src="https://picsum.photos/id/230/200/300" alt="" class="slide">
        </div>
    </div>
    <div class="lightBox" id="lightBox">
        <button id="prevBtn">&lt</button>
        <button id="nextBtn">&gt</button>
        <button id="close">&times;</button>
        <img src="" alt="" id="largeImage">
    </div>
    <script src="app.js"></script>
</body>
</html>
